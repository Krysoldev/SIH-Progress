<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Master Dev Infrastructure Platform</title>
  <link rel="stylesheet" href="assets/css/aurum.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface-1);
      border: 1px solid var(--border-medium);
      border-radius: 14px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #cbd5e1 0%, #475569 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(203, 213, 225, 0.2);
    }
    .tab-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 22px;
    }
    .tab-btn {
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--silver-bright);
      color: var(--bg-canvas);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .demo-persona-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .persona-card {
      padding: 10px;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .persona-card:hover {
      border-color: var(--border-bright);
      background: var(--bg-surface-3);
    }
    .persona-name {
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--text-bright);
    }
    .persona-role {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-logo">
          <div style="width: 20px; height: 20px; background: var(--bg-surface-1); border-radius: 4px;"></div>
        </div>
        <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 500; color: var(--text-bright); letter-spacing: -0.02em;">
          MASTER <span style="font-style: italic; color: #cbd5e1;">DEV</span>
        </h1>
        <p style="font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.08em; margin-top: 4px;">
          Infrastructure Intelligence Platform
        </p>
      </div>

      <!-- Tab Switch -->
      <div class="tab-switch">
        <button class="tab-btn active" id="btnTabSignin" onclick="switchLoginTab('signin')">SIGN IN</button>
        <button class="tab-btn" id="btnTabSignup" onclick="switchLoginTab('signup')">CREATE ACCOUNT</button>
      </div>

      <!-- Sign In Form -->
      <form id="formSignin" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Official Email</label>
          <input type="email" id="signinEmail" class="form-input" required value="rajesh.nair@masterdev.infra">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--silver-primary);">Forgot key?</a>
          </div>
          <input type="password" id="signinPass" class="form-input" required value="Director2026!">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-muted); cursor: pointer;">
            <input type="checkbox" checked style="accent-color: var(--silver-primary);">
            <span>Remember session on this workstation</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px;">
          SIGN IN TO CONSOLE →
        </button>
      </form>

      <!-- Sign Up Form (hidden by default) -->
      <form id="formSignup" style="display: none;" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label">Full Name & Title</label>
          <input type="text" id="regName" class="form-input" placeholder="e.g. Dr. Sunita Rao" required>
        </div>

        <div class="form-group">
          <label class="form-label">Official Email</label>
          <input type="email" id="regEmail" class="form-input" placeholder="sunita.rao@infra.gov.in" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPass" class="form-input" placeholder="Minimum 6 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label">Clearance Role</label>
          <select class="form-select">
            <option>Project Director</option>
            <option>Financial Controller</option>
            <option>Site Resident Engineer</option>
            <option>AI Risk Analyst</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px;">
          CREATE IDENTITY & PROCEED →
        </button>
      </form>

      <!-- Clean Demo Persona Access -->
      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle);">
        <span style="display: block; text-align: center; font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">
          Quick Demo Persona Sign In
        </span>
        <div class="demo-persona-grid">
          <div class="persona-card" onclick="selectPersona('rajesh.nair@masterdev.infra')">
            <div class="persona-name">Rajesh Nair</div>
            <div class="persona-role">Project Director</div>
          </div>
          <div class="persona-card" onclick="selectPersona('priya.sharma@masterdev.infra')">
            <div class="persona-name">Priya Sharma</div>
            <div class="persona-role">CFO Controller</div>
          </div>
          <div class="persona-card" onclick="selectPersona('vikram.singh@masterdev.infra')">
            <div class="persona-name">Vikram Singh</div>
            <div class="persona-role">Resident Eng.</div>
          </div>
          <div class="persona-card" onclick="selectPersona('arjun.mehta@masterdev.infra')">
            <div class="persona-name">Dr. Arjun Mehta</div>
            <div class="persona-role">AI Risk Analyst</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function switchLoginTab(tab) {
      const btnIn = document.getElementById('btnTabSignin');
      const btnUp = document.getElementById('btnTabSignup');
      const formIn = document.getElementById('formSignin');
      const formUp = document.getElementById('formSignup');

      if (tab === 'signin') {
        btnIn.classList.add('active');
        btnUp.classList.remove('active');
        formIn.style.display = 'block';
        formUp.style.display = 'none';
      } else {
        btnUp.classList.add('active');
        btnIn.classList.remove('active');
        formUp.style.display = 'block';
        formIn.style.display = 'none';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      showToast('Authentication verified. Entering Master Dev console...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 600);
    }

    function handleSignup(e) {
      e.preventDefault();
      showToast('Account registered successfully. Entering console...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 600);
    }

    function selectPersona(email) {
      document.getElementById('signinEmail').value = email;
      showToast('Persona credentials loaded.', 'info');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    }
  </script>
</body>
</html>
